<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background Badge with contrast border for light and dark browser themes -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#hrGrad)" stroke="#1E40AF" stroke-width="2" />
  <!-- Isotype Letters HR -->
  <text 
    x="32" 
    y="43" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="0.5px"
  >HR</text>
</svg>
